services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_dev_data:/data/db

  redis:
    image: redis:8.8-m03-trixie
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  mongo_dev_data:
  redis_dev_data:
