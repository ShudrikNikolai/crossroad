services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [crossroad]

  redis:
    image: redis:8.8-m03-trixie
    container_name: cr-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [crossroad]

  minio:
    image: minio/minio:latest
    container_name: cr-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../env/.env.minio
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [crossroad]

  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    container_name: cr-backend
    restart: unless-stopped
    env_file:
      - ../env/.env.backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [crossroad]

  frontend:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    container_name: cr-frontend
    restart: unless-stopped
    env_file:
      - ../env/.env.frontend
    depends_on:
      - backend
    networks: [crossroad]

  nginx:
    image: nginx:1.27-alpine
    container_name: cr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/sites-conf:/etc/nginx/sites-conf:ro
    depends_on:
      - backend
      - frontend
    networks: [crossroad]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cr-otel-collector
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol-contrib/otel-collector.yaml"
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger
    networks: [crossroad]

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: cr-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
    networks: [crossroad]

  prometheus:
    image: prom/prometheus:latest
    container_name: cr-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_dev_data:/prometheus
    depends_on:
      - otel-collector
    networks: [crossroad]

networks:
  crossroad:
    driver: bridge

volumes:
  mongo_dev_data:
  redis_dev_data:
  minio_dev_data:
  prometheus_dev_data:
